function targets(p=state.profile){
 const bmi=p.weight/((p.height/100)**2);
 const bmr=p.formula==='katch'&&p.bf>0&&p.bf<65?370+21.6*p.weight*(1-p.bf/100):p.formula==='harris'?(p.sex==='male'?88.362+13.397*p.weight+4.799*p.height-5.677*p.age:447.593+9.247*p.weight+3.098*p.height-4.330*p.age):10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161);
 const tdee=bmr*p.activity,requested=Math.round(tdee*(p.mode==='cut'?1-p.speed:p.mode==='gain'?1.1:1));
 const energy=requested,pr=p.weight*p.protein,fa=energy*p.fat/900,ca=(energy-pr*4-fa*9)/4;
 const reasons=[];
 if(p.mode==='cut'&&(bmi<18.5||p.goal/((p.height/100)**2)<18.5||p.goal>=p.weight))reasons.push(tr('Kiểm tra cân nặng mục tiêu.','Check your goal weight.'));
 if(p.mode==='gain'&&p.goal<=p.weight)reasons.push(tr('Mục tiêu tăng cân phải cao hơn cân hiện tại.','Gain goal must exceed current weight.'));
 if(energy<(p.sex==='male'?1500:1200)||ca<0)reasons.push(tr('Calo quá thấp hoặc macro không khả thi.','Calories too low or macros infeasible.'));
 if(p.mode==='cut'&&p.speed>=.30)reasons.push(tr('Siêu tốc: chỉ xem ước tính; cần tư vấn chuyên môn.','Rapid loss: estimate only; seek professional guidance.'));
 if(p.mode==='cut'&&(tdee-energy)*7/7700>p.weight*.01)reasons.push(tr('Tốc độ ước tính vượt 1% cân nặng/tuần.','Estimated loss exceeds 1% of weight per week.'));
 return {bmi,bmr,tdee,energy,macro:[pr,Math.max(0,ca),fa],reasons,ok:!reasons.length,weeks:p.mode==='cut'&&p.goal<p.weight&&energy<tdee?Math.ceil((p.weight-p.goal)*7700/(tdee-energy)/7):null};
}

 const fd=fineDraft;if(!fd)return '';const all=fineCandidates(),term=normalized(fd.q);let shown=all.filter(x=>normalized(fname(x.f)+' '+x.f.vi+' '+x.f.en).includes(term));
 if(!fd.showAll&&!term)shown=shown.filter(x=>x.gain>0.0001||fd.selected.has(x.f.id)).slice(0,10);
 if(!shown.length)return '<p class="empty">'+(term?tr('Không tìm thấy món phù hợp.','No matching foods.'):tr('Không cần thêm món để tiến gần mục tiêu. Bạn vẫn có thể xem toàn bộ thư viện.','No additional food improves the target. You can still view all foods.'))+'</p>';
 return shown.map(({f,g,gain})=>{const v=value(f,g);return '<label class="fine-option"><input type="checkbox" '+(fd.selected.has(f.id)?'checked':'')+' onchange="fineToggle(\''+f.id+'\',this.checked)"><span class="grow"><strong>'+safe(fname(f))+'</strong><small>'+tr('Gợi ý ','Suggested ')+fmt(g)+' g · '+fmt(kcal(v))+' kcal · P '+fmt(v[0],1)+' / C '+fmt(v[1],1)+' / F '+fmt(v[2],1)+'</small></span></label>'}).join('');
}
function fineToggle(id,checked){if(!fineDraft)return;if(checked)fineDraft.selected.add(id);else fineDraft.selected.delete(id);updateFineSelection()}

function fineShowAll(){fineDraft.showAll=!fineDraft.showAll;$('fineList').innerHTML=fineListHtml();$('fineMore').textContent=fineDraft.showAll?tr('Chỉ xem gợi ý','Suggestions only'):tr('Xem tất cả món','View all foods')}
function renderFineModal(){
 const fd=fineDraft;if(!fd)return;
 modal('<div class="fine-head row between"><h2 style="margin:0">'+tr('Làm gần đúng','Fine-tune')+'</h2>'+btn('×','closeModal()','icon')+'</div><p style="font-weight:650">'+tr('Bạn muốn cân đối dựa trên các món đang có hay thêm món mới?','Balance your existing foods or add new foods?')+'</p><div class="protein-band"><small>'+tr('Sau khi cân đối món hiện có','After balancing existing foods')+'</small><div class="fine-summary">'+fineDeficits()+'</div>'+btn(tr('Chỉ cân đối món hiện có','Balance existing foods only'),'applyFine(false)','primary')+'</div><h3>'+tr('Món dễ mua có thể bổ sung','Easy-to-find foods to add')+'</h3><p class="fine-caption">'+tr('Tích chọn món bạn muốn. Không tự thêm món khác.','Select the foods you want. No other foods will be added.')+'</p><div class="field">'+choice(fd.meal,mealOptions(),'fineDraft.meal=Number(this.value)')+'</div><div class="row" style="margin-top:9px"><div class="grow"><input type="search" placeholder="'+tr('Tìm món muốn thêm...','Find foods to add...')+'" oninput="fineSearch(this.value)"></div><button class="small" type="button" id="fineMore" onclick="fineShowAll()">'+tr('Xem tất cả món','View all foods')+'</button></div><div class="fine-list" id="fineList">'+fineListHtml()+'</div><p id="fineCount" class="note"></p><div class="fine-summary" id="fineSelected"></div><div class="fine-actions"><button type="button" class="accent" id="fineApplyBtn" onclick="applyFine(true)" disabled>'+tr('Thêm món đã chọn & cân đối','Add selected foods & balance')+'</button>'+btn(tr('Hủy','Cancel'),'closeModal()')+'</div>');

function applyFine(withAdditions){
 const fd=fineDraft,t=menuAllowed();if(!fd||fd.date!==date||!t)return;
 const d=day(),prior=fd.prior;
 if(!withAdditions&&!prior.length){notify(tr('Chưa có món để cân đối. Hãy chọn món bên dưới.','No foods to balance. Choose foods below.'));return}
 if(withAdditions&&!fd.selected.size)return;
 const rows=prior.map(r=>({...r,min:r.lock?r.g:Math.min(r.g,food(r.id)?.step||50)}));
 if(withAdditions)for(const id of fd.selected){const f=food(id);if(f)rows.push({id,key:uid(),meal:fd.meal,g:f.step,min:f.step,lock:false})}
 snapshotUndo();const best=solve(rows,t.macro,d.eaten,true);d.plan=best.rows;
 lastChanges=[];for(const r of prior){const next=d.plan.find(x=>x.key===r.key);const diff=(next?.g||0)-r.g;if(diff)lastChanges.push(fname(food(r.id))+' '+(diff>0?'+':'')+fmt(diff)+' g')}
 for(const r of d.plan.filter(r=>!prior.some(x=>x.key===r.key)))lastChanges.push(tr('Thêm ','Add ')+fmt(r.g)+' g '+fname(food(r.id)));
 if(!lastChanges.length)lastChanges=[tr('Không có điều chỉnh tốt hơn trong giới hạn hiện tại.','No better adjustment within current limits.')];
 fineDraft=null;closeModal();persist();render();
}

const metrics=[
['weight','Cân nặng','Weight','kg',35,220,.1],['bf','Mỡ cơ thể','Body fat','%',3,60,.1],['muscle','Khối lượng cơ','Muscle mass','kg',5,120,.1],['skeletal','Cơ xương','Skeletal muscle','kg',5,100,.1],['lean','Khối lượng không mỡ','Fat-free mass','kg',20,180,.1],['water','Nước cơ thể','Body water','%',20,80,.1],['visceral','Mỡ nội tạng (chỉ số cân)','Visceral fat (scale index)','',1,60,1],['bone','Khối lượng xương','Bone mass','kg',.5,8,.1],['bmr','BMR trên cân','Scale BMR','kcal',600,3500,10],['waist','Vòng bụng ngang rốn','Waist at navel','cm',40,180,.5],['neck','Vòng cổ','Neck','cm',20,65,.5],['arm','Vòng tay','Upper arm','cm',15,75,.5],['thigh','Vòng đùi','Thigh','cm',25,110,.5],['hip','Vòng mông','Hip','cm',50,180,.5],['chest','Vòng ngực','Chest','cm',50,170,.5],['calf','Vòng bắp chân','Calf','cm',15,75,.5]
];
const ml=m=>tr(m[1],m[2]);
const metricBy=k=>metrics.find(m=>m[0]===k);
function metricWheel(k){const m=metricBy(k);openWheel(ml(m),metricDraft[k]??(k==='weight'?state.profile.weight:null),m[4],m[5],m[6],m[3],v=>{metricDraft[k]=v;render()},true)}
function loadMetricDate(v){metricDate=v||dayNow();metricDraft={...(state.logs.find(x=>x.date===metricDate)?.values||{})};render()}
function saveMetrics(){const values=Object.fromEntries(Object.entries(metricDraft).filter(([k,v])=>metricBy(k)&&v!==null&&Number.isFinite(v)));if(!Object.keys(values).length){notify(tr('Thêm ít nhất một chỉ số.','Add at least one measurement.'));return}
 state.logs=state.logs.filter(x=>x.date!==metricDate);state.logs.push({date:metricDate,values});state.logs.sort((a,b)=>a.date.localeCompare(b.date));
 const latestWeight=[...state.logs].reverse().find(l=>l.values.weight!=null);if(latestWeight)state.profile.weight=latestWeight.values.weight;
 const latestFat=[...state.logs].reverse().find(l=>l.values.bf!=null);if(latestFat)state.profile.bf=latestFat.values.bf;state.configured=true;
 persist();render();notify(tr('Đã lưu chỉ số','Measurements saved'))}
function removeLog(d){if(!confirm(tr('Xóa lần đo này?','Delete this measurement?')))return;state.logs=state.logs.filter(x=>x.date!==d);if(metricDate===d)metricDraft={};persist();render()}
const colors=['#16775b','#3d83c5','#d38b37','#a05cba','#cb5f58','#789449'];
function renderProgress(){const latest=state.logs.at(-1),primary=['weight','bf','waist','muscle'];
 return '<div class="grid"><div><div class="card">'+section(tr('Theo dõi cơ thể','Body tracking'))+'<div class="fields">'+field(tr('Ngày đo','Measurement date'),'<input type="date" value="'+safe(metricDate)+'" onchange="loadMetricDate(this.value)">',true)+metrics.slice(0,3).map(m=>field(ml(m),wheelButton(showVal(metricDraft[m[0]],m[3]),"metricWheel('"+m[0]+"')"))).join('')+field(ml(metricBy('waist')),wheelButton(showVal(metricDraft.waist,'cm'),"metricWheel('waist')"))+'</div><details><summary>'+tr('Thêm chỉ số cân Scan Body & số đo','More scale readings & measurements')+'</summary><div class="fields">'+metrics.filter(m=>!['weight','bf','muscle','waist'].includes(m[0])).map(m=>field(ml(m),wheelButton(showVal(metricDraft[m[0]],m[3]),"metricWheel('"+m[0]+"')"))).join('')+'</div></details><div class="toolbar">'+btn(tr('Lưu lần đo','Save measurements'),'saveMetrics()','primary')+'</div><p class="note">'+tr('Các chỉ số đều tùy chọn. Nên đo cùng thời điểm và điều kiện.','All readings optional. Measure under consistent conditions.')+'</p></div><div class="card">'+section(tr('Nhận xét xu hướng','Trend insights'))+progressAdvice()+'</div></div><div><div class="card">'+section(tr('Biểu đồ tiến độ','Progress chart'))+'<div class="stats">'+primary.map(k=>{const m=metricBy(k),l=[...state.logs].reverse().find(x=>x.values[k]!=null);return '<div><small>'+ml(m)+'</small><b>'+(l?fmt(l.values[k],1):'—')+'</b><small>'+m[3]+'</small></div>'}).join('')+'</div>'+choice(chartMetric,[['all',tr('Tổng hợp · mốc đầu = 100','Overview · baseline = 100')],...metrics.map(m=>[m[0],ml(m)])],'chartMetric=this.value;render()')+chartHtml()+'</div><div class="card">'+section(tr('Lịch sử đo','History'))+(state.logs.length?[...state.logs].reverse().map(l=>'<div class="logrow"><div class="row between"><b>'+safe(l.date)+'</b><div>'+btn(tr('Sửa','Edit'),"loadMetricDate('"+l.date+"')",'small')+' '+btn('×',"removeLog('"+l.date+"')",'small danger')+'</div></div><small>'+Object.entries(l.values).map(([k,v])=>{const m=metricBy(k);return m?ml(m)+' '+fmt(v,1)+' '+m[3]:''}).filter(Boolean).join(' · ')+'</small></div>').join(''):'<div class="empty">'+tr('Chưa có dữ liệu.','No measurements yet.')+'</div>')+'</div></div></div>';
}
function chartHtml(){
 const ks=chartMetric==='all'?['weight','bf','waist','muscle','thigh','arm']: [chartMetric];const series=ks.map((k,i)=>{const raw=state.logs.filter(l=>l.values[k]!=null).map(l=>({date:l.date,v:l.values[k]}));const first=raw[0]?.v;return {k,color:colors[i%colors.length],points:raw.map(p=>({...p,y:chartMetric==='all'?100*p.v/first:p.v}))}}).filter(s=>s.points.length);
 if(!series.length)return '<div class="empty">'+tr('Thêm số đo để xem biểu đồ.','Add measurements to see a chart.')+'</div>';
 const points=series.flatMap(s=>s.points),times=points.map(p=>Date.parse(p.date)),minT=Math.min(...times),maxT=Math.max(...times),ys=points.map(p=>p.y),mi=Math.min(...ys),ma=Math.max(...ys),pad=Math.max((ma-mi)*.12,chartMetric==='all'?1:.5),low=mi-pad,high=ma+pad;
 const x=p=>maxT===minT?280:50+490*(Date.parse(p.date)-minT)/(maxT-minT),y=v=>185-160*(v-low)/(high-low);
 return '<svg class="chart" viewBox="0 0 570 220" role="img" aria-label="'+tr('Biểu đồ thay đổi số đo','Measurement trend chart')+'">'+[0,1,2,3,4].map(i=>{const v=low+(high-low)*i/4;return '<line x1="50" x2="540" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#e5ece6"/><text x="43" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="#64776f">'+fmt(v,1)+'</text>'}).join('')+series.map(s=>'<polyline points="'+s.points.map(p=>x(p)+','+y(p.y)).join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="3" stroke-linejoin="round"/>'+s.points.map(p=>'<circle cx="'+x(p)+'" cy="'+y(p.y)+'" r="4" fill="'+s.color+'"><title>'+safe(p.date+' · '+fmt(p.v,1))+'</title></circle>').join('')).join('')+'<text x="50" y="212" font-size="11" fill="#64776f">'+new Date(minT).toISOString().slice(0,10)+'</text><text x="540" y="212" text-anchor="end" font-size="11" fill="#64776f">'+new Date(maxT).toISOString().slice(0,10)+'</text></svg><div class="legend">'+series.map(s=>'<span><i class="dot" style="background:'+s.color+'"></i>'+ml(metricBy(s.k))+'</span>').join('')+'</div>';
}
function trend(k){const a=state.logs.filter(l=>l.values[k]!=null);if(a.length<2)return null;const first=a[0],last=a.at(-1),days=(Date.parse(last.date)-Date.parse(first.date))/864e5;return {delta:last.values[k]-first.values[k],days,first:first.values[k],last:last.values[k]}}
function progressAdvice(){const w=trend('weight'),waist=trend('waist'),bf=trend('bf'),muscle=trend('muscle'),out=[];if(w&&w.days>=7){const rate=100*w.delta/w.first*7/w.days;out.push(tr('Cân nặng thay đổi ','Weight change ')+(w.delta>0?'+':'')+fmt(w.delta,1)+' kg / '+w.days+tr(' ngày.',' days.'));if(rate< -1)out.push(tr('Giảm nhanh: xem lại thâm hụt và phục hồi.','Rapid loss: review deficit and recovery.'));else if(state.profile.mode==='cut'&&Math.abs(rate)<.1&&w.days>=14)out.push(tr('Cân tương đối ổn định: kiểm tra nhật ký và vòng bụng trước khi giảm calo.','Weight is stable: check diary and waist before cutting calories.'));else if(rate<0&&state.profile.mode==='cut')out.push(tr('Xu hướng cân giảm; tiếp tục theo dõi sức mạnh.','Weight trends down; monitor strength.'))}
 if(waist&&waist.days>=7)out.push(tr('Vòng bụng ','Waist ')+(waist.delta>0?'+':'')+fmt(waist.delta,1)+' cm.');if(bf&&bf.days>=7)out.push(tr('Mỡ trên cân ','Scale body fat ')+(bf.delta>0?'+':'')+fmt(bf.delta,1)+tr(' điểm %. Chỉ xem xu hướng.',' percentage points. Trend only.'));if(muscle&&muscle.days>=7&&muscle.delta< -1)out.push(tr('Chỉ số cơ giảm: kiểm tra điều kiện đo, tập kháng lực và lượng đạm.','Muscle estimate fell: check measurement conditions, resistance training and protein.'));
 if(!out.length)out.push(tr('Cần ít nhất hai lần đo cách nhau 7 ngày để nhận xét xu hướng.','At least two measurements 7 days apart are needed for trend insights.'));
 out.push(tr('Cân điện trở kháng bị ảnh hưởng bởi nước; không dùng để chẩn đoán.','Bioimpedance varies with hydration; not diagnostic.'));return out.map(x=>'<p class="advice">'+safe(x)+'</p>').join('')}
function renderSettings(){return '<div class="card narrow">'+section(tr('Cài đặt','Settings'))+'<div class="fields">'+field(tr('Ngôn ngữ','Language'),choice(state.lang,[['vi','Tiếng Việt'],['en','English']],"state.lang=this.value;persist();render()"),true)+'</div><hr><h3>'+tr('Dữ liệu của bạn','Your data')+'</h3><div class="toolbar">'+btn(tr('Xuất JSON','Export JSON'),'exportData()','primary')+btn(tr('Nhập JSON','Import JSON'),"document.getElementById('importFile').click()")+'</div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"><p class="note">'+tr('Không gửi dữ liệu lên máy chủ. Sao lưu khi đổi điện thoại hoặc trình duyệt.','No data sent to a server. Back up before switching devices or browsers.')+'</p><hr><h3>'+tr('Thông tin','About')+'</h3><p class="note">'+tr('Phiên bản 1.2 · TDEE và thực phẩm là ước tính. Không dùng cho trẻ em, thai kỳ, người đang điều trị bệnh hay rối loạn ăn uống nếu chưa có tư vấn chuyên môn. Macro chưa phản ánh đầy đủ chất xơ, vitamin, khoáng chất và natri.','Version 1.2 · TDEE and foods are estimates. Not for children, pregnancy, eating disorders or medical conditions without professional guidance. Macros do not cover all fiber, vitamins, minerals and sodium.')+'</p><p class="note">'+tr('Tham khảo nguyên lý từ TDEE Macro Calculator, Body Goals và LLMN. Dữ liệu thực phẩm là giá trị tham khảo làm tròn, có thể chỉnh bằng món riêng.','Design concepts from TDEE Macro Calculator, Body Goals and LLMN. Food values are rounded reference estimates; use custom foods to adjust.')+'</p><p><a href="https://fdc.nal.usda.gov/" target="_blank" rel="noopener" >USDA FoodData Central</a> · <a href="https://www.canada.ca/en/health-canada/services/food-nutrition/healthy-eating/dietary-reference-intakes/tables/reference-values-macronutrients.html" target="_blank" rel="noopener">DRI / AMDR</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/25926512/" target="_blank" rel="noopener">Protein & weight management</a> · <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13665703/" target="_blank" rel="noopener">ISSN</a> · <a href="https://github.com/LamHoaiLinh/Calo_Calculator" target="_blank" rel="noopener">GitHub</a></p><hr>'+btn(tr('Xóa dữ liệu trên thiết bị','Reset local data'),'resetData()','danger')+'</div>'}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='calo-backup-'+dayNow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validateBackup(x){
 if(!x||!x.profile||!Array.isArray(x.custom)||!Array.isArray(x.logs)||!x.days||typeof x.days!=='object')return false;
 const p=x.profile;if(!['male','female'].includes(p.sex)||!['cut','maintain','gain'].includes(p.mode)||![1.2,1.375,1.55,1.725,1.9].includes(p.activity)||![.1,.2,.25,.3].includes(p.speed)||![2,3].includes(p.meals)||(p.snack!==undefined&&typeof p.snack!=='boolean'))return false;
 for(const k of Object.keys(pfRanges)){const [min,max]=pfRanges[k],v=p[k];if(k==='bf'&&v===null)continue;if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max)return false}
 const validId=x=>typeof x==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(x);
 const vf=f=>f&&validId(f.id)&&typeof f.vi==='string'&&f.vi.length<=80&&typeof f.en==='string'&&f.en.length<=80&&Object.keys(groups()).includes(f.g)&&[f.p,f.c,f.f].every(v=>typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=100)&&f.p+f.c+f.f<=100.2&&[5,10,25,50,100].includes(f.step)&&Number.isFinite(f.cap)&&f.cap>0&&f.cap<=2000;
 if(!x.custom.every(vf)||new Set([...base,...x.custom].map(f=>f.id)).size!==base.length+x.custom.length)return false;
 const ids=new Set([...base,...x.custom].map(f=>f.id));const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d));
 for(const [d,obj] of Object.entries(x.days)){if(!validDate(d)||!obj||!Array.isArray(obj.plan)||!Array.isArray(obj.eaten))return false;for(const [kind,rs] of [['plan',obj.plan],['eaten',obj.eaten]])for(const r of rs){if(!r||!validId(r.key)||!validId(r.id)||!Number.isFinite(r.g)||r.g<=0||r.g>2000||![0,1,2,3].includes(r.meal)||typeof r.lock!=='boolean'||(kind==='plan'?!ids.has(r.id):!vf(r.snapshot)))return false}}
 return x.logs.every(l=>l&&validDate(l.date)&&l.values&&Object.entries(l.values).every(([k,v])=>{const m=metricBy(k);return m&&typeof v==='number'&&Number.isFinite(v)&&v>=m[4]&&v<=m[5]}));
}
async function importData(file){if(!file)return;try{const x=JSON.parse(await file.text());if(!validateBackup(x))throw Error('invalid');if(!confirm(tr('Thay dữ liệu hiện tại bằng bản sao lưu?','Replace current data with backup?')))return;state={...initial(),...x,lang:x.lang==='en'?'en':'vi',prefs:Object.fromEntries(Object.entries(x.prefs||{}).filter(([k,v])=>[0,1,-1].includes(v)))};undo=null;lastChanges=[];metricDraft={};persist();go('today');notify(tr('Đã nhập dữ liệu','Backup imported'))}catch(e){notify(tr('Tệp sao lưu không hợp lệ.','Invalid backup file.'))}}
function resetData(){if(!confirm(tr('Xóa toàn bộ dữ liệu? Hành động này không thể hoàn tác.','Delete all data? This cannot be undone.')))return;state=initial();undo=null;lastChanges=[];metricDraft={};persist();go('today')}
