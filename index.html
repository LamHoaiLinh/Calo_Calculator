<script>
'use strict';
const KEY='calo-planner-v1';
const $=id=>document.getElementById(id);
const dayNow=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const initial=()=>({lang:'vi',profile:{sex:'male',age:30,height:170,weight:70,goal:65,activity:1.375,mode:'cut',speed:.20,protein:1.6,fat:30,formula:'mifflin',bf:null,meals:3},custom:[],prefs:{},days:{},logs:[]});
let state=initial(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.profile)state={...initial(),...saved,profile:{...initial().profile,...saved.profile}}}catch(e){storageOK=false}
let tab='today',date=dayNow(),query='',category='all',pickerMeal=1,chartMetric='all',undo=null,toastTimer,metricDraft={},metricDate=dayNow(),lastChanges=[],wheelChoice=null;
const tr=(vi,en)=>state.lang==='vi'?vi:en;
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>Number(n).toLocaleString(state.lang==='vi'?'vi-VN':'en-US',{maximumFractionDigits:d});
const num=n=>Math.round(n*10)/10;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const kcal=v=>4*v[0]+4*v[1]+9*v[2];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;notify(tr('Không thể lưu trên thiết bị. Hãy sao lưu dữ liệu.','Could not save locally. Export a backup.'))}};
const notify=msg=>{clearTimeout(toastTimer);$('toast').textContent=msg;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3300)};
const day=()=>state.days[date]||(state.days[date]={plan:[],eaten:[]});
const mealNames=()=>[tr('Bữa sáng','Breakfast'),tr('Bữa trưa','Lunch'),tr('Bữa tối','Dinner'),tr('Bữa phụ','Snack')];
const groups=()=>({protein:tr('Đạm','Protein'),carb:tr('Tinh bột','Carbs'),veg:tr('Rau củ','Vegetables'),fruit:tr('Trái cây','Fruit'),fat:tr('Chất béo','Fats'),dairy:tr('Sữa & đậu','Dairy & soy'),custom:tr('Món của bạn','Your foods')});
// Approximate macros per 100 g edible portion, standard prepared state.
// id, Vietnamese, English, category, P, C, F, practical increment, daily cap
const raw=[

['thigh','Đùi gà chín, bỏ da','Cooked skinless chicken thigh','protein',26,0,8,50,350],

['egg','Trứng gà luộc','Boiled egg','protein',12.6,1.1,10.6,50,150],

['salmon','Cá hồi chín','Cooked salmon','protein',22,0,12,50,300],
['tuna','Cá ngừ ngâm nước, ráo','Tuna in water, drained','protein',25.5,0,.8,50,250],

['tofu','Đậu hũ trắng','Plain tofu','protein',8.1,1.9,4.8,50,400],

['rice','Cơm trắng chín','Cooked white rice','carb',2.7,28.2,.3,50,650],
['brownrice','Cơm gạo lứt chín','Cooked brown rice','carb',2.7,25.6,1,50,600],
['sweetpotato','Khoai lang luộc','Boiled sweet potato','carb',1.6,20,.1,50,450],
['potato','Khoai tây luộc','Boiled potato','carb',1.9,20.1,.1,50,450],
['oats','Yến mạch khô','Dry rolled oats','carb',13,67,6.5,10,100],
['bread','Bánh mì nguyên cám','Whole wheat bread','carb',12,43,4,25,200],
['noodle','Bún tươi','Fresh rice noodles','carb',1.8,25,.2,50,450],
['corn','Bắp luộc, hạt','Boiled corn kernels','carb',3.4,21,1.5,50,300],
['pumpkin','Bí đỏ luộc','Boiled pumpkin','veg',1,6.5,.1,50,400],
['broccoli','Bông cải xanh luộc','Boiled broccoli','veg',2.4,7.2,.4,50,450],
['beans','Đậu que luộc','Boiled green beans','veg',1.9,7.9,.3,50,400],
['cabbage','Bắp cải luộc','Boiled cabbage','veg',1.3,5.5,.1,50,400],
['carrot','Cà rốt luộc','Boiled carrot','veg',.8,8.2,.2,50,300],
['cucumber','Dưa leo','Cucumber','veg',.7,3.6,.1,50,300],
['tomato','Cà chua','Tomato','veg',.9,3.9,.2,50,300],
['spinach','Rau cải bó xôi luộc','Boiled spinach','veg',3,3.8,.3,50,300],

];
const base=raw.map(([id,vi,en,g,p,c,f,step,cap])=>({id,vi,en,g,p,c,f,step,cap}));
const catalog=()=>[...base,...state.custom];
const food=id=>catalog().find(f=>f.id===id);
const fname=f=>f?(state.lang==='vi'?f.vi:f.en||f.vi):tr('Món đã xóa','Removed food');
const value=(f,g)=>[f.p*g/100,f.c*g/100,f.f*g/100];
const rv=r=>r.snapshot?value(r.snapshot,r.g):food(r.id)?value(food(r.id),r.g):[0,0,0];
const sum=rs=>rs.reduce((a,r)=>{const v=rv(r);return a.map((n,i)=>n+v[i])},[0,0,0]);
function targets(p=state.profile){
 const bmi=p.weight/((p.height/100)**2);
 const bmr=p.formula==='katch'&&p.bf>0&&p.bf<65?370+21.6*p.weight*(1-p.bf/100):p.formula==='harris'?(p.sex==='male'?88.362+13.397*p.weight+4.799*p.height-5.677*p.age:447.593+9.247*p.weight+3.098*p.height-4.330*p.age):10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161);
 const tdee=bmr*p.activity,requested=Math.round(tdee*(p.mode==='cut'?1-p.speed:p.mode==='gain'?1.1:1));
 const energy=requested,pr=p.weight*p.protein,fa=energy*p.fat/900,ca=(energy-pr*4-fa*9)/4;
 const reasons=[];
 if(p.mode==='cut'&&(bmi<18.5||p.goal/((p.height/100)**2)<18.5||p.goal>=p.weight))reasons.push(tr('Kiểm tra cân nặng mục tiêu.','Check your goal weight.'));
 if(p.mode==='gain'&&p.goal<=p.weight)reasons.push(tr('Mục tiêu tăng cân phải cao hơn cân hiện tại.','Gain goal must exceed current weight.'));
 if(energy<(p.sex==='male'?1500:1200)||ca<0)reasons.push(tr('Calo quá thấp hoặc macro không khả thi.','Calories too low or macros infeasible.'));
 if(p.mode==='cut'&&p.speed>=.30)reasons.push(tr('Siêu tốc: chỉ xem ước tính; cần tư vấn chuyên môn.','Rapid loss: estimate only; seek professional guidance.'));
 if(p.mode==='cut'&&(tdee-energy)*7/7700>p.weight*.01)reasons.push(tr('Tốc độ ước tính vượt 1% cân nặng/tuần.','Estimated loss exceeds 1% of weight per week.'));
 return {bmi,bmr,tdee,energy,macro:[pr,Math.max(0,ca),fa],reasons,ok:!reasons.length,weeks:p.mode==='cut'&&p.goal<p.weight&&energy<tdee?Math.ceil((p.weight-p.goal)*7700/(tdee-energy)/7):null};
}
const navItems=()=>[['today','◉',tr('Hôm nay','Today')],['profile','◎',tr('Mục tiêu','Targets')],['foods','▤',tr('Thực phẩm','Foods')],['progress','↗',tr('Tiến độ','Progress')],['settings','⚙',tr('Cài đặt','Settings')]];
function go(t){tab=t;query='';category='all';render();window.scrollTo({top:0,behavior:'instant'})}
function toggleLang(){state.lang=state.lang==='vi'?'en':'vi';persist();render()}
function render(){document.documentElement.lang=state.lang;$('tagline').textContent=tr('Dinh dưỡng cá nhân','Personal nutrition');$('lang').textContent=state.lang==='vi'?'EN':'VI';$('nav').innerHTML=navItems().map(([id,ic,label])=>'<button class="'+(tab===id?'on':'')+'" onclick="go(\''+id+'\')"><span class="navicon" aria-hidden="true">'+ic+'</span>'+label+'</button>').join('');
 $('foot').textContent=tr('Calo • Dữ liệu lưu trên thiết bị • Chỉ dành cho người trưởng thành','Calo • Stored on this device • Adults only');
 $('app').innerHTML=({today:renderToday,profile:renderProfile,foods:renderFoods,progress:renderProgress,settings:renderSettings}[tab]||renderToday)();
}
const section=(title,extra='')=>'<div class="sectiontitle"><h2>'+title+'</h2>'+extra+'</div>';
const field=(label,html,span=false)=>'<div class="field '+(span?'span2':'')+'"><label>'+label+'</label>'+html+'</div>';
const btn=(text,action,cls='')=>'<button class="'+cls+'" onclick="'+action+'">'+text+'</button>';
const choice=(v,opts,action)=>'<select aria-label="'+safe(tr('Lựa chọn','Choose'))+'" onchange="'+action+'">'+opts.map(([x,l])=>'<option value="'+safe(x)+'" '+(String(v)===String(x)?'selected':'')+'>'+safe(l)+'</option>').join('')+'</select>';
const wheelButton=(label,action)=>'<button class="wheelbtn" onclick="'+action+'">'+safe(label)+'</button>';
const showVal=(x,unit='',d=1)=>x===null||x===undefined||x===''?tr('Thêm','Add'):fmt(x,d)+(unit?' '+unit:'');
function modal(content){const m=$('modal');m.innerHTML=content;if(!m.open)m.showModal()}
function closeModal(){$('modal').close();wheelChoice=null}
function openWheel(title,current,min,max,step,unit,callback,nullable=false){
 const values=[];if(nullable)values.push(null);for(let x=min;x<=max+step/10;x+=step)values.push(Math.round(x*100)/100);
 let idx=current==null&&nullable?0:values.reduce((best,x,i)=>x!==null&&Math.abs(x-(current??min))<Math.abs((values[best]??-1e9)-(current??min))?i:best,nullable?1:0);
 wheelChoice={values,idx,callback};
 modal('<div class="row between"><h2 style="margin:0">'+safe(title)+'</h2>'+btn('×','closeModal()','icon')+'</div><div class="wheelwrap"><div class="wheelmark"></div><div class="wheel" id="wheel" tabindex="0" role="listbox" aria-label="'+safe(title)+'">'+values.map((x,i)=>'<div role="option" data-index="'+i+'" onclick="wheelSelect('+i+')">'+(x===null?tr('Bỏ trống','Not set'):fmt(x,2)+' '+safe(unit))+'</div>').join('')+'</div></div><div class="dialogfoot">'+btn(tr('Hủy','Cancel'),'closeModal()')+btn(tr('Xong','Done'),'wheelDone()','primary')+'</div>');
 const w=$('wheel');w.scrollTop=idx*44;markWheel(idx);w.addEventListener('scroll',()=>markWheel(clamp(Math.round(w.scrollTop/44),0,values.length-1)),{passive:true});
 w.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();wheelSelect(clamp(wheelChoice.idx+(e.key==='ArrowUp'?-1:1),0,values.length-1))}if(e.key==='Enter'){e.preventDefault();wheelDone()}});
}
function markWheel(i){if(!wheelChoice)return;wheelChoice.idx=i;const w=$('wheel');if(!w)return;w.querySelector('.sel')?.classList.remove('sel');const x=w.children[i];if(x)x.classList.add('sel')}
function wheelSelect(i){if(!wheelChoice)return;$('wheel').scrollTop=i*44;markWheel(i)}
function wheelDone(){if(!wheelChoice)return;const w=wheelChoice,i=clamp(Math.round($('wheel').scrollTop/44),0,w.values.length-1);closeModal();w.callback(w.values[i])}

}

 return '<p class="advice">'+(parts.length?parts.join(' · '):tr('Thực đơn gần mục tiêu.','Menu is close to target.'))+'</p>';

 const f={id:id||'u'+uid(),vi,en:$('ce').value.trim()||vi,g:$('cg').value,p:v[0]*100/w,c:v[1]*100/w,f:v[2]*100/w,step:Number($('cs').value),cap:400,custom:true};if(id)state.custom=state.custom.map(x=>x.id===id?f:x);else{state.custom.push(f);state.prefs[f.id]=1}persist();closeModal();go('foods');notify(tr('Đã cập nhật thư viện','Library updated'))}

// Discrete bounded coordinate descent, repeated starts; practical gram increments.
// Optimization weighs daily energy/macros, limits portions, preserves locked/logged foods.
function objective(v,target){const e=kcal(v),te=kcal(target);return v.reduce((a,x,i)=>a+((x-target[i])/Math.max(12,target[i]))**2,0)+2*((e-te)/Math.max(200,te))**2}
function solve(rows,target,eaten,keep=false){
 const rr=rows.filter(r=>food(r.id)).map(r=>({...r}));const original=rr.map(r=>r.g);
 let v=sum([...eaten,...rr]);const used={};rr.forEach(r=>used[r.id]=(used[r.id]||0)+r.g);eaten.forEach(r=>used[r.id]=(used[r.id]||0)+r.g);
 let current=objective(v,target);const changeCost=(g,i)=>keep?.0008*Math.abs(g-original[i])/Math.max(50,original[i]):0;
 for(let iter=0;iter<260;iter++){let best=null,bestDelta=0;for(let i=0;i<rr.length;i++){const r=rr[i],f=food(r.id);if(r.lock)continue;const step=f.step||50;const maxPerMeal=f.g==='fat'?Math.min(f.cap,30):f.g==='protein'?Math.min(f.cap,250):f.g==='carb'?Math.min(f.cap,350):Math.min(f.cap,300);

function menuPool(g){return catalog().filter(f=>f.g===g&&pref(f)!==-1)}

function seedRows(locked,eaten){const rows=locked.map(r=>({...r})),used={};[...eaten,...locked].forEach(r=>used[r.id]=(used[r.id]||0)+1);

 const add=(g,m,min=0)=>{const f=randomPick(g,used);if(!f)return;if(rows.some(r=>r.meal===m&&r.id===f.id))return;const step=f.step;let amount=normalPortion(f);amount=Math.max(step,Math.round(amount/step)*step);rows.push({id:f.id,key:uid(),meal:m,g:Math.min(amount,f.cap),lock:false,min});used[f.id]=(used[f.id]||0)+1};

 if(!eatenMeals.has(3)){add('dairy',3);add('fruit',3);add('fat',3)}
 if(rows.length===locked.length){add('protein',3);add('carb',3);add('veg',3);add('fat',3)}
 // Favorite custom foods are eligible and may be selected; insert one when possible.

 if(custom.length){const f=custom[Math.floor(Math.random()*custom.length)],m=slots.find(x=>!eatenMeals.has(x))??3;const i=rows.findIndex(r=>r.meal===m&&!r.lock&&food(r.id)?.g===f.g);const row={id:f.id,key:uid(),meal:m,g:Math.max(f.step,Math.round(normalPortion(f)/f.step)*f.step),lock:false};if(i>=0)rows[i]=row;else rows.push(row)}

function snapshotUndo(){undo={date,rows:day().plan.map(r=>({...r}))}}
function generate(){const t=menuAllowed();if(!t)return;const d=day(),locked=d.plan.filter(r=>r.lock);snapshotUndo();let best=null;for(let k=0;k<32;k++){const result=solve(seedRows(locked,d.eaten),t.macro,d.eaten);if(!best||result.score<best.score)best=result}d.plan=best?.rows||locked;lastChanges=[];persist();render();notify(tr('Đã tạo thực đơn','Menu generated'))}
function fineTune(){const t=menuAllowed();if(!t)return;const d=day();if(!d.plan.length){generate();return}const prior=d.plan.map(r=>({...r}));snapshotUndo();const opt=solve(prior,t.macro,d.eaten,true);let best=opt;

 const groupsNeeded=missing.map((x,i)=>({x,i})).filter(o=>o.x>Math.max(8,t.macro[o.i]*.07)).sort((a,b)=>b.x/t.macro[b.i]-a.x/t.macro[a.i]);

 d.plan=best.rows;lastChanges=[];for(const r of prior){const next=d.plan.find(x=>x.key===r.key);const diff=(next?.g||0)-r.g;if(diff)lastChanges.push(fname(food(r.id))+' '+(diff>0?'+':'')+fmt(diff)+' g')}for(const r of d.plan.filter(r=>!prior.some(x=>x.key===r.key)))lastChanges.push(tr('Thêm ','Add ')+fmt(r.g)+' g '+fname(food(r.id)));if(!lastChanges.length)lastChanges=[tr('Không có điều chỉnh tốt hơn trong giới hạn hiện tại.','No better adjustment within current limits.')];persist();render();
}

function chartHtml(){

function validateBackup(x){

 const ids=new Set([...base,...x.custom].map(f=>f.id));const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d));
 for(const [d,obj] of Object.entries(x.days)){if(!validDate(d)||!obj||!Array.isArray(obj.plan)||!Array.isArray(obj.eaten))return false;for(const [kind,rs] of [['plan',obj.plan],['eaten',obj.eaten]])for(const r of rs){if(!r||!validId(r.key)||!validId(r.id)||!Number.isFinite(r.g)||r.g<=0||r.g>2000||![0,1,2,3].includes(r.meal)||typeof r.lock!=='boolean'||(kind==='plan'?!ids.has(r.id):!vf(r.snapshot)))return false}}
